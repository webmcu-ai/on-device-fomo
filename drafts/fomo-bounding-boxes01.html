<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOMO Annotator</title>
<style>
  :root {
    --bg: #0e0e0e;
    --panel: #1a1a1a;
    --border: #2e2e2e;
    --accent: #00e5ff;
    --accent2: #ff6b35;
    --text: #e0e0e0;
    --muted: #666;
    --box: rgba(0,229,255,0.25);
    --box-border: #00e5ff;
    --done: #2a4a2a;
    --done-text: #6fcf6f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── HEADER ── */
  #myHeader {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  #myHeader h1 {
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  #myFolderBtn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 5px 14px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
    flex-shrink: 0;
  }
  #myFolderBtn:hover { background: #00b8cc; }
  #myFolderName {
    color: var(--muted);
    font-size: 11px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #myStatus {
    margin-left: auto;
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── MAIN LAYOUT ── */
  #myMain {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── FILE LIST ── */
  #myFileList {
    width: 200px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #myFileListHeader {
    padding: 6px 10px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .myFileItem {
    padding: 7px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.1s;
  }
  .myFileItem:hover { background: #222; }
  .myFileItem.myActive { background: #1e2e2e; color: var(--accent); }
  .myFileItem.myHasBoxes { color: var(--done-text); }
  .myFileItem.myActive.myHasBoxes { background: #1a2e1a; }
  .myDot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    flex-shrink: 0;
  }
  .myDot.myFilled { background: var(--done-text); }
  .myDot.myActive { background: var(--accent); }
  .myFileName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── CANVAS AREA ── */
  #myCanvasArea {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  #myToolbar {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }
  #myToolbar span { color: var(--muted); font-size: 11px; }
  .myBtn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 3px 10px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .myBtn:hover { border-color: var(--accent); color: var(--accent); }
  .myBtn.myDanger:hover { border-color: #ff4444; color: #ff4444; }
  #myImgName {
    color: var(--accent2);
    font-size: 11px;
    margin-left: 4px;
  }
  #myBoxCount {
    color: var(--muted);
    font-size: 11px;
  }

  #myCanvasWrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #111;
    position: relative;
  }
  #myCanvas {
    cursor: crosshair;
    display: block;
    image-rendering: pixelated;
  }

  /* ── JSON PANEL ── */
  #myJsonPanel {
    width: 260px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #myJsonHeader {
    padding: 6px 10px;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  #myJsonSaveBtn {
    background: var(--accent2);
    color: #000;
    border: none;
    padding: 2px 8px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    letter-spacing: 1px;
  }
  #myJsonSaveBtn:hover { background: #e05520; }
  #myJsonDisplay {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .myJsonEntry {
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }
  .myJsonEntryHeader {
    background: #222;
    padding: 4px 8px;
    font-size: 10px;
    color: var(--accent2);
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
  }
  .myJsonEntryHeader:hover { background: #2a2a2a; }
  .myJsonEntryBody {
    padding: 6px 8px;
  }
  .myBoxRow {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    font-size: 10px;
    color: var(--muted);
  }
  .myBoxRow span { color: var(--accent); }
  .myDelBox {
    background: transparent;
    border: 1px solid #333;
    color: #666;
    font-size: 9px;
    padding: 1px 4px;
    cursor: pointer;
    font-family: monospace;
    margin-left: auto;
  }
  .myDelBox:hover { border-color: #ff4444; color: #ff4444; }
  #myEmptyMsg {
    color: var(--muted);
    font-size: 11px;
    text-align: center;
    padding: 20px;
    line-height: 1.8;
  }

  /* ── EMPTY STATE ── */
  #myEmptyState {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 10px;
    pointer-events: none;
  }
  #myEmptyState .myBig { font-size: 40px; }
  #myEmptyState p { font-size: 12px; letter-spacing: 1px; }

  /* ── SAVE FLASH ── */
  #mySaveFlash {
    position: fixed;
    top: 10px; right: 10px;
    background: var(--done-text);
    color: #000;
    font-size: 11px;
    font-weight: bold;
    padding: 5px 12px;
    letter-spacing: 1px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  #mySaveFlash.myShow { opacity: 1; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--panel); }
  ::-webkit-scrollbar-thumb { background: var(--border); }
</style>
</head>
<body>

<!-- HEADER -->
<div id="myHeader">
  <h1>FOMO Annotator</h1>
  <button id="myFolderBtn" onclick="myOpenFolder()">OPEN FOLDER</button>
  <span id="myFolderName">No folder selected</span>
  <span id="myStatus"></span>
</div>

<!-- MAIN -->
<div id="myMain">

  <!-- FILE LIST -->
  <div id="myFileList">
    <div id="myFileListHeader">Images</div>
    <div id="myFileItems"></div>
  </div>

  <!-- CANVAS -->
  <div id="myCanvasArea">
    <div id="myToolbar">
      <span id="myImgName">—</span>
      <span id="myBoxCount"></span>
      <div style="margin-left:auto; display:flex; gap:6px;">
        <button class="myBtn" onclick="myUndoLast()">UNDO</button>
        <button class="myBtn myDanger" onclick="myClearBoxes()">CLEAR ALL</button>
        <button class="myBtn" onclick="myNavFile(-1)">◀ PREV</button>
        <button class="myBtn" onclick="myNavFile(1)">NEXT ▶</button>
      </div>
    </div>
    <div id="myCanvasWrap">
      <div id="myEmptyState">
        <div class="myBig">⊞</div>
        <p>OPEN A CLASS FOLDER TO BEGIN</p>
        <p style="font-size:10px; margin-top:4px;">DRAG TO DRAW BOUNDING BOXES</p>
      </div>
      <canvas id="myCanvas"></canvas>
    </div>
  </div>

  <!-- JSON PANEL -->
  <div id="myJsonPanel">
    <div id="myJsonHeader">
      annotations.json
      <button id="myJsonSaveBtn" onclick="mySaveJson()">SAVE</button>
    </div>
    <div id="myJsonDisplay">
      <div id="myEmptyMsg">Open a folder and<br>draw boxes to begin.<br><br>
        JSON saves automatically<br>to the class folder as<br><b style="color:var(--accent)">annotations.json</b>
      </div>
    </div>
  </div>
</div>

<div id="mySaveFlash">SAVED</div>

<script>
// ======================================================
// FOMO ANNOTATOR — single-file HTML
// Jeremy Ellis / webmcu-ai
// Uses File System Access API (Chrome/Edge desktop)
// Saves annotations.json to the opened class folder
// ======================================================

// -- State --
let myFolderHandle = null;
let myImageFiles   = [];       // array of {name, handle}
let myCurrentIdx   = -1;
let myAnnotations  = {};       // { filename: [{x1,y1,x2,y2}, ...] }
let myJsonHandle   = null;

// Canvas drawing state
let myCanvas   = document.getElementById('myCanvas');
let myCtx      = myCanvas.getContext('2d');
let myImg      = null;
let myDrawing  = false;
let myStartX   = 0;
let myStartY   = 0;
let myCurrentBox = null;  // box being drawn right now

// Canvas display scale (image may be scaled to fit the panel)
let myScale = 1;
let myOffX  = 0;
let myOffY  = 0;

// ======================================================
// FOLDER OPEN
// ======================================================
async function myOpenFolder() {
  try {
    myFolderHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
  } catch(e) {
    if (e.name !== 'AbortError') mySetStatus('Error: ' + e.message, true);
    return;
  }

  document.getElementById('myFolderName').textContent = myFolderHandle.name;
  document.getElementById('myEmptyState').style.display = 'none';

  myImageFiles = [];
  myAnnotations = {};
  myJsonHandle = null;

  // Scan folder for images and existing annotations.json
  for await (const [name, handle] of myFolderHandle.entries()) {
    if (handle.kind === 'file') {
      const lower = name.toLowerCase();
      if (lower.endsWith('.jpg') || lower.endsWith('.jpeg') || lower.endsWith('.png') || lower.endsWith('.bmp')) {
        myImageFiles.push({ name, handle });
      }
      if (name === 'annotations.json') {
        myJsonHandle = handle;
      }
    }
  }

  // Sort alphabetically
  myImageFiles.sort((a, b) => a.name.localeCompare(b.name));

  // Load existing annotations
  if (myJsonHandle) {
    try {
      const file = await myJsonHandle.getFile();
      const text = await file.text();
      myAnnotations = JSON.parse(text);
    } catch(e) {
      myAnnotations = {};
    }
  }

  myBuildFileList();
  mySetStatus(myImageFiles.length + ' images found');

  if (myImageFiles.length > 0) myLoadImage(0);
}

// ======================================================
// FILE LIST
// ======================================================
function myBuildFileList() {
  const container = document.getElementById('myFileItems');
  container.innerHTML = '';
  myImageFiles.forEach((f, idx) => {
    const hasBoxes = myAnnotations[f.name] && myAnnotations[f.name].length > 0;
    const div = document.createElement('div');
    div.className = 'myFileItem' + (hasBoxes ? ' myHasBoxes' : '') + (idx === myCurrentIdx ? ' myActive' : '');
    div.id = 'myFile_' + idx;
    div.onclick = () => myLoadImage(idx);

    const dot = document.createElement('div');
    dot.className = 'myDot' + (hasBoxes ? ' myFilled' : '') + (idx === myCurrentIdx ? ' myActive' : '');

    const nameSpan = document.createElement('span');
    nameSpan.className = 'myFileName';
    nameSpan.title = f.name;
    nameSpan.textContent = f.name;

    div.appendChild(dot);
    div.appendChild(nameSpan);
    container.appendChild(div);
  });
}

function myUpdateFileItem(idx) {
  const el = document.getElementById('myFile_' + idx);
  if (!el) return;
  const f = myImageFiles[idx];
  const hasBoxes = myAnnotations[f.name] && myAnnotations[f.name].length > 0;
  const isActive = idx === myCurrentIdx;
  el.className = 'myFileItem' + (hasBoxes ? ' myHasBoxes' : '') + (isActive ? ' myActive' : '');
  const dot = el.querySelector('.myDot');
  dot.className = 'myDot' + (hasBoxes ? ' myFilled' : '') + (isActive ? ' myActive' : '');
}

// ======================================================
// LOAD IMAGE
// ======================================================
async function myLoadImage(idx) {
  if (idx < 0 || idx >= myImageFiles.length) return;

  // Deactivate previous
  if (myCurrentIdx >= 0) myUpdateFileItem(myCurrentIdx);

  myCurrentIdx = idx;
  const f = myImageFiles[idx];

  document.getElementById('myImgName').textContent = f.name;

  // Load image blob -> object URL -> draw
  const file = await f.handle.getFile();
  const url  = URL.createObjectURL(file);

  myImg = new Image();
  myImg.onload = () => {
    myFitCanvas();
    myRedraw();
    URL.revokeObjectURL(url);
  };
  myImg.src = url;

  myUpdateFileItem(idx);
  myScrollFileIntoView(idx);
  myRenderJson();
  myUpdateBoxCount();
}

function myFitCanvas() {
  const wrap = document.getElementById('myCanvasWrap');
  const ww = wrap.clientWidth  - 20;
  const wh = wrap.clientHeight - 20;
  const iw = myImg.naturalWidth;
  const ih = myImg.naturalHeight;

  myScale = Math.min(ww / iw, wh / ih, 1);  // never upscale past 1:1
  // If image is tiny (e.g. 64x64 training images), allow upscaling to fill space
  if (iw <= 128 && ih <= 128) {
    myScale = Math.min(Math.floor(ww / iw), Math.floor(wh / ih), 8);
  }

  myCanvas.width  = Math.round(iw * myScale);
  myCanvas.height = Math.round(ih * myScale);
  myOffX = 0;
  myOffY = 0;
}

// ======================================================
// DRAWING
// ======================================================
myCanvas.addEventListener('mousedown', e => {
  if (!myImg) return;
  myDrawing = true;
  const r = myCanvas.getBoundingClientRect();
  myStartX = e.clientX - r.left;
  myStartY = e.clientY - r.top;
  myCurrentBox = null;
});

myCanvas.addEventListener('mousemove', e => {
  if (!myDrawing || !myImg) return;
  const r = myCanvas.getBoundingClientRect();
  const cx = e.clientX - r.left;
  const cy = e.clientY - r.top;
  myCurrentBox = myNormaliseBox(myStartX, myStartY, cx, cy);
  myRedraw();
});

myCanvas.addEventListener('mouseup', e => {
  if (!myDrawing || !myImg) return;
  myDrawing = false;
  if (!myCurrentBox) return;

  // Reject tiny accidental clicks (< 2% of image in either dimension)
  if ((myCurrentBox.x2 - myCurrentBox.x1) < 0.02 || (myCurrentBox.y2 - myCurrentBox.y1) < 0.02) {
    myCurrentBox = null;
    myRedraw();
    return;
  }

  const fname = myImageFiles[myCurrentIdx].name;
  if (!myAnnotations[fname]) myAnnotations[fname] = [];
  myAnnotations[fname].push({ ...myCurrentBox });
  myCurrentBox = null;

  myRedraw();
  myRenderJson();
  myUpdateBoxCount();
  myUpdateFileItem(myCurrentIdx);
  mySaveJson();  // auto-save on every new box
});

myCanvas.addEventListener('mouseleave', () => {
  if (myDrawing) {
    myDrawing = false;
    myCurrentBox = null;
    myRedraw();
  }
});

// Touch support for tablets
myCanvas.addEventListener('touchstart', e => { e.preventDefault(); myCanvas.dispatchEvent(new MouseEvent('mousedown', myTouchToMouse(e))); }, { passive: false });
myCanvas.addEventListener('touchmove',  e => { e.preventDefault(); myCanvas.dispatchEvent(new MouseEvent('mousemove',  myTouchToMouse(e))); }, { passive: false });
myCanvas.addEventListener('touchend',   e => { e.preventDefault(); myCanvas.dispatchEvent(new MouseEvent('mouseup',   myTouchToMouse(e))); }, { passive: false });
function myTouchToMouse(e) {
  const t = e.touches[0] || e.changedTouches[0];
  return { clientX: t.clientX, clientY: t.clientY, bubbles: true };
}

// Convert canvas pixel coords -> normalised image fractions
function myNormaliseBox(ax, ay, bx, by) {
  const w = myCanvas.width;
  const h = myCanvas.height;
  return {
    x1: Math.max(0, Math.min(ax, bx) / w),
    y1: Math.max(0, Math.min(ay, by) / h),
    x2: Math.min(1, Math.max(ax, bx) / w),
    y2: Math.min(1, Math.max(ay, by) / h),
  };
}

// ======================================================
// REDRAW
// ======================================================
function myRedraw() {
  if (!myImg) return;
  const w = myCanvas.width;
  const h = myCanvas.height;
  myCtx.clearRect(0, 0, w, h);
  myCtx.drawImage(myImg, 0, 0, w, h);

  const fname = myImageFiles[myCurrentIdx]?.name;
  const boxes = (fname && myAnnotations[fname]) || [];

  // Saved boxes
  boxes.forEach((b, i) => {
    myDrawBox(b, `hsl(${(i * 67) % 360}, 90%, 60%)`, i + 1);
  });

  // Box currently being drawn
  if (myCurrentBox) {
    myDrawBox(myCurrentBox, '#00e5ff', '?');
  }
}

function myDrawBox(b, color, label) {
  const w = myCanvas.width;
  const h = myCanvas.height;
  const px = b.x1 * w;
  const py = b.y1 * h;
  const pw = (b.x2 - b.x1) * w;
  const ph = (b.y2 - b.y1) * h;

  // Shadow for visibility on any background
  myCtx.strokeStyle = 'rgba(0,0,0,0.6)';
  myCtx.lineWidth = 3;
  myCtx.strokeRect(px, py, pw, ph);

  myCtx.strokeStyle = color;
  myCtx.lineWidth = 2;
  myCtx.strokeRect(px, py, pw, ph);

  // Label badge
  myCtx.fillStyle = color;
  myCtx.fillRect(px, py - 16, 20, 16);
  myCtx.fillStyle = '#000';
  myCtx.font = 'bold 11px monospace';
  myCtx.fillText(label, px + 3, py - 4);
}

// ======================================================
// CONTROLS
// ======================================================
function myUndoLast() {
  if (myCurrentIdx < 0) return;
  const fname = myImageFiles[myCurrentIdx].name;
  if (myAnnotations[fname] && myAnnotations[fname].length > 0) {
    myAnnotations[fname].pop();
    myRedraw();
    myRenderJson();
    myUpdateBoxCount();
    myUpdateFileItem(myCurrentIdx);
    mySaveJson();
  }
}

function myClearBoxes() {
  if (myCurrentIdx < 0) return;
  const fname = myImageFiles[myCurrentIdx].name;
  myAnnotations[fname] = [];
  myRedraw();
  myRenderJson();
  myUpdateBoxCount();
  myUpdateFileItem(myCurrentIdx);
  mySaveJson();
}

function myNavFile(dir) {
  myLoadImage(myCurrentIdx + dir);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'd') myNavFile(1);
  if (e.key === 'ArrowLeft'  || e.key === 'a') myNavFile(-1);
  if (e.key === 'z' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); myUndoLast(); }
  if (e.key === 'Delete') myClearBoxes();
});

function myScrollFileIntoView(idx) {
  const el = document.getElementById('myFile_' + idx);
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function myUpdateBoxCount() {
  const fname = myImageFiles[myCurrentIdx]?.name;
  const count = (fname && myAnnotations[fname]?.length) || 0;
  document.getElementById('myBoxCount').textContent = count > 0 ? `[${count} box${count > 1 ? 'es' : ''}]` : '[no boxes]';
}

// ======================================================
// JSON PANEL RENDER
// ======================================================
function myRenderJson() {
  const panel = document.getElementById('myJsonDisplay');
  const entries = Object.entries(myAnnotations).filter(([, boxes]) => boxes && boxes.length > 0);

  if (entries.length === 0) {
    panel.innerHTML = '<div id="myEmptyMsg">Draw boxes on images.<br><br>JSON auto-saves to<br><b style="color:var(--accent)">annotations.json</b><br>in the class folder.</div>';
    return;
  }

  panel.innerHTML = '';
  entries.forEach(([fname, boxes]) => {
    const isActive = myImageFiles[myCurrentIdx]?.name === fname;
    const div = document.createElement('div');
    div.className = 'myJsonEntry';
    if (isActive) div.style.borderColor = 'var(--accent)';

    const header = document.createElement('div');
    header.className = 'myJsonEntryHeader';
    header.innerHTML = `<span>${fname}</span><span style="color:var(--muted)">${boxes.length} box${boxes.length > 1 ? 'es' : ''}</span>`;
    header.onclick = () => {
      const idx = myImageFiles.findIndex(f => f.name === fname);
      if (idx >= 0) myLoadImage(idx);
    };

    const body = document.createElement('div');
    body.className = 'myJsonEntryBody';
    boxes.forEach((b, i) => {
      const row = document.createElement('div');
      row.className = 'myBoxRow';
      row.innerHTML = `
        <span>#${i+1}</span>
        x1:<span>${b.x1.toFixed(3)}</span>
        y1:<span>${b.y1.toFixed(3)}</span>
        x2:<span>${b.x2.toFixed(3)}</span>
        y2:<span>${b.y2.toFixed(3)}</span>
        <button class="myDelBox" onclick="myDeleteBox('${fname}',${i})">✕</button>`;
      body.appendChild(row);
    });

    div.appendChild(header);
    div.appendChild(body);
    panel.appendChild(div);
  });
}

function myDeleteBox(fname, idx) {
  if (!myAnnotations[fname]) return;
  myAnnotations[fname].splice(idx, 1);
  myRedraw();
  myRenderJson();
  myUpdateBoxCount();
  myUpdateFileItem(myImageFiles.findIndex(f => f.name === fname));
  mySaveJson();
}

// ======================================================
// SAVE JSON
// ======================================================
async function mySaveJson() {
  if (!myFolderHandle) return;

  // Build clean output — only files that have boxes
  const out = {};
  Object.entries(myAnnotations).forEach(([fname, boxes]) => {
    if (boxes && boxes.length > 0) {
      out[fname] = boxes.map(b => ({
        x1: parseFloat(b.x1.toFixed(4)),
        y1: parseFloat(b.y1.toFixed(4)),
        x2: parseFloat(b.x2.toFixed(4)),
        y2: parseFloat(b.y2.toFixed(4)),
      }));
    }
  });

  const json = JSON.stringify(out, null, 2);

  try {
    if (!myJsonHandle) {
      myJsonHandle = await myFolderHandle.getFileHandle('annotations.json', { create: true });
    }
    const writable = await myJsonHandle.createWritable();
    await writable.write(json);
    await writable.close();
    myFlashSaved();
  } catch(e) {
    mySetStatus('Save error: ' + e.message, true);
  }
}

function myFlashSaved() {
  const el = document.getElementById('mySaveFlash');
  el.classList.add('myShow');
  setTimeout(() => el.classList.remove('myShow'), 1200);
}

function mySetStatus(msg, isError) {
  const el = document.getElementById('myStatus');
  el.textContent = msg;
  el.style.color = isError ? '#ff4444' : 'var(--accent2)';
}

// ======================================================
// RESIZE HANDLER
// ======================================================
window.addEventListener('resize', () => {
  if (myImg) { myFitCanvas(); myRedraw(); }
});

// ======================================================
// STARTUP CHECK
// ======================================================
if (!('showDirectoryPicker' in window)) {
  document.getElementById('myStatus').textContent = 'ERROR: needs Chrome or Edge desktop';
  document.getElementById('myStatus').style.color = '#ff4444';
  document.getElementById('myFolderBtn').disabled = true;
}
</script>
</body>
</html>
